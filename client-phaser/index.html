<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Monsvers: The Battle Monster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #060a13;
        background-image:
          radial-gradient(circle at 26% 22%, rgba(56, 189, 248, 0.16), transparent 52%),
          radial-gradient(circle at 76% 78%, rgba(249, 115, 22, 0.11), transparent 48%),
          radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.65), #04070f 85%);
        color: #f8fafc;
        font-family: 'Chakra Petch', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
      }
      /* Pre-warm Google pixel/RPG fonts so Phaser canvas text picks them up promptly */
      .font-preloader {
        position: fixed;
        top: -9999px;
        left: -9999px;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
      }
      #game-container {
        width: 100vw;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 3px solid #1e2d4a;
        border-radius: 16px;
        background: #070b14;
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.28),
          0 0 0 5px #0b1222,
          0 0 0 6px rgba(148, 163, 184, 0.16),
          0 0 38px rgba(56, 189, 248, 0.14),
          0 28px 72px rgba(0, 0, 0, 0.82);
      }
      @media (max-width: 767px) {
        #game-container canvas {
          border: none;
          border-radius: 0;
          box-shadow: none;
        }
      }

      /* Sleek non-blocking portrait orientation hint for mobile phones */
      #landscape-banner {
        display: none;
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: calc(100vw - 24px);
        max-width: 420px;
        padding: 10px 12px;
        background: linear-gradient(180deg, rgba(15, 25, 46, 0.96), rgba(8, 14, 28, 0.96));
        border: 1.5px solid rgba(56, 189, 248, 0.85);
        border-radius: 10px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 12px 30px rgba(0, 0, 0, 0.72),
          0 0 18px rgba(56, 189, 248, 0.16);
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-family: 'Chakra Petch', ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.35;
        color: #e2e8f0;
      }
      #landscape-banner .banner-msg {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #landscape-banner .banner-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: rgba(56, 189, 248, 0.16);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }
      #landscape-banner button {
        background: linear-gradient(180deg, #38bdf8, #0284c7);
        color: #040a14;
        border: 1px solid #7dd3fc;
        border-radius: 6px;
        padding: 6px 11px;
        font-family: 'Chakra Petch', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 2px 0 #075985;
      }
      #landscape-banner button:active {
        transform: translateY(1px) scale(0.97);
      }
      #landscape-banner.dismissed {
        display: none !important;
      }
      @media (orientation: portrait) and (max-width: 767px) {
        #landscape-banner {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="font-preloader" aria-hidden="true">
      <span style="font-family: 'Silkscreen', monospace; font-weight: 400">.</span>
      <span style="font-family: 'Silkscreen', monospace; font-weight: 700">.</span>
      <span style="font-family: 'Chakra Petch', monospace; font-weight: 500">.</span>
      <span style="font-family: 'Chakra Petch', monospace; font-weight: 600">.</span>
      <span style="font-family: 'Chakra Petch', monospace; font-weight: 700">.</span>
    </div>
    <div id="landscape-banner" role="status" aria-live="polite">
      <div class="banner-msg">
        <span class="banner-icon" aria-hidden="true">↻</span>
        <span>Putar layar ke Landscape untuk tampilan optimal</span>
      </div>
      <button id="dismiss-landscape-banner" type="button">Lanjut</button>
    </div>
    <div id="game-container"></div>
    <script>
      (function () {
        var btn = document.getElementById('dismiss-landscape-banner');
        var banner = document.getElementById('landscape-banner');
        if (btn && banner) {
          btn.addEventListener('click', function () {
            banner.classList.add('dismissed');
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
